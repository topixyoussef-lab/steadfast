<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Steadfast Watch</title>
    <style>
      body {
        font-family: system-ui, "Segoe UI", sans-serif;
        margin: 0;
        padding: 14px 16px;
        width: 260px;
        background: #0f1420;
        color: #e8ecf4;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        color: #9ad1ff;
      }
      p {
        margin: 4px 0;
        font-size: 12px;
      }
      .muted {
        color: #93a0b4;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 7px 0;
        border: 0;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        background: #1e8fff;
        color: #fff;
      }
      button.secondary {
        background: #26324a;
      }
      input {
        width: 100%;
        margin-top: 8px;
        padding: 6px 8px;
        border: 1px solid #33415c;
        border-radius: 6px;
        font-size: 11px;
        direction: ltr;
        text-align: left;
        background: #0b0f18;
        color: #e8ecf4;
        box-sizing: border-box;
      }
      .badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11px;
      }
      .ok {
        background: #0f3d24;
        color: #5ee08a;
      }
      .no {
        background: #3d1f0f;
        color: #ffb27a;
      }
    </style>
  </head>
  <body>
    <h1>Steadfast Watch</h1>
    <p><span id="status" class="badge no">غير متصل</span></p>
    <p class="muted">مراقب: <span id="counts">0</span></p>
    <p class="muted">آخر موقع: <span id="last">—</span></p>
    <p class="muted">الحالة: <span id="code">—</span></p>
    <button id="link">ربط الحساب (جلسة)</button>
    <input id="bindcode" type="text" placeholder="الصق الكود هنا…" />
    <button id="bindbtn" class="secondary">ربط بالكود</button>
    <button id="unlink" class="secondary" hidden>إنهاء الربط</button>
    <button id="flush" class="secondary">إرسال الآن</button>
    <script src="popup.js"></script>
  </body>
</html>
